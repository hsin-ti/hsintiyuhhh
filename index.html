<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿拉伯語禮儀短句助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ef; --card:#ffffff; --ink:#2b2a26; --muted:#7a7367;
    --accent:#1f6f54; --accent-soft:#e7f1ec; --gold:#b8912f; --line:#e8e1d4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7;
  }
  header{
    position:sticky; top:0; z-index:10; background:rgba(250,246,239,.94);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .bar{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:1.05rem;color:var(--accent)}
  .brand span{color:var(--muted);font-weight:400;font-size:.85rem;margin-left:6px}
  nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  nav button{
    border:1px solid transparent;background:transparent;color:var(--ink);
    padding:7px 13px;border-radius:999px;cursor:pointer;font-size:.9rem;font-family:inherit;
  }
  nav button:hover{background:var(--accent-soft)}
  nav button.active{background:var(--accent);color:#fff}
  main{max-width:980px;margin:0 auto;padding:28px 18px 80px}
  h1{font-size:1.7rem;margin-bottom:8px;letter-spacing:.02em}
  h2{font-size:1.25rem;margin:26px 0 12px}
  .lead{color:var(--muted);margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .scene-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
    cursor:pointer;transition:.18s;text-align:left;font-family:inherit;
  }
  .scene-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 20px rgba(31,111,84,.10)}
  .scene-icon{font-size:1.6rem}
  .scene-name{font-weight:700;margin-top:6px}
  .scene-ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;color:var(--muted);font-size:1.05rem}
  .filters{display:flex;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
  .fgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .fgroup label{font-size:.82rem;color:var(--muted);margin-right:2px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .count{font-size:.85rem;color:var(--muted);margin-bottom:14px}
  .phrase{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .phrase .ar{direction:rtl;text-align:right;font-family:'Noto Naskh Arabic',serif;font-size:1.75rem;line-height:2;margin-bottom:2px}
  .phrase .tr{color:var(--gold);font-size:.92rem;font-style:italic;margin-bottom:6px}
  .phrase .zh{font-size:1.05rem;font-weight:600;margin-bottom:10px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:.75rem;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px}
  .tag.gray{background:#f1ede4;color:var(--muted)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 13px;font-size:.86rem;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.saved{background:var(--accent);color:#fff;border-color:var(--accent)}
  details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  summary{cursor:pointer;font-size:.86rem;color:var(--accent);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";transition:.2s;display:inline-block}
  details[open] summary::before{transform:rotate(90deg)}
  .detail-body{font-size:.9rem;color:#4a463f;margin-top:8px;display:grid;gap:6px}
  .detail-body b{color:var(--accent)}
  .example-ar{direction:rtl;text-align:right;font-family:'Noto Naskh Arabic',serif;font-size:1.15rem;line-height:1.9;color:var(--ink)}
  .example-zh{color:var(--muted);font-size:.88rem}
  .gender-note{font-size:.78rem;color:var(--gold);margin-top:2px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .back{margin-bottom:16px}
  .quiz-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
  .quiz-progress{font-size:.85rem;color:var(--muted);margin-bottom:10px}
  .quiz-q{font-size:1.15rem;font-weight:600;margin-bottom:16px;line-height:1.8}
  .quiz-q .ar{direction:rtl;font-family:'Noto Naskh Arabic',serif;font-size:1.6rem}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:9px;cursor:pointer;font-size:.96rem;font-family:inherit;transition:.15s}
  .opt:hover{border-color:var(--accent)}
  .opt.correct{background:#e7f5ec;border-color:#2e8b57;color:#1c5e3a}
  .opt.wrong{background:#fdeaea;border-color:#c94b4b;color:#8f2b2b}
  .opt .ar{direction:rtl;font-family:'Noto Naskh Arabic',serif;font-size:1.25rem}
  .quiz-result{text-align:center;padding:20px 0}
  .quiz-result .score{font-size:2.6rem;font-weight:700;color:var(--accent)}
  .about-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px}
  .about-card h3{font-size:1.05rem;margin-bottom:8px;color:var(--accent)}
  .about-card ul{margin-left:20px;color:#4a463f;font-size:.93rem}
  .about-card p{font-size:.93rem;color:#4a463f}
  .disclaimer{background:#fff8e6;border:1px solid #f0e0b0;border-radius:12px;padding:14px 16px;font-size:.86rem;color:#7a6320;margin-top:16px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:30px 18px}
  @media(max-width:560px){
    h1{font-size:1.4rem}
    .phrase .ar{font-size:1.5rem}
    .bar{padding:10px 14px}
    nav button{padding:6px 10px;font-size:.84rem}
  }
</style>
</head>
<body>

/* ============================================================
   2. 狀態與工具
   ============================================================ */
const state = {
  view: 'home',
  scene: null,
  filters: {audience:'all', gender:'male', register:'all'},
  favorites: JSON.parse(localStorage.getItem('ar_greeting_fav') || '[]'),
  quiz: null
};

const app = document.getElementById('app');
const byId = id => PHRASES.find(p => p.id === id);

function saveFav(){
  localStorage.setItem('ar_greeting_fav', JSON.stringify(state.favorites));
}
function isFav(id){ return state.favorites.includes(id); }
function toggleFav(id){
  const i = state.favorites.indexOf(id);
  if(i > -1) state.favorites.splice(i,1);
  else state.favorites.push(id);
  saveFav();
  render();
}
function shuffle(a){
  const arr = [...a];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function speak(text){
  if(!('speechSynthesis' in window)){
    alert('此瀏覽器不支援語音播放。');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function displayForm(p){
  if(p.gender === 'variable'){
    if(state.filters.gender === 'female'){
      return {ar: p.arF || p.ar, tr: p.trF || p.tr, note: '女性形式'};
    }
    return {ar: p.arM || p.ar, tr: p.trM || p.tr, note: '男性形式'};
  }
  return {ar: p.ar, tr: p.tr, note: ''};
}
function matchAudience(p, aud){
  return aud === 'all' || p.audience.includes('all') || p.audience.includes(aud);
}
function matchRegister(p, reg){
  return reg === 'all' || p.register === reg || p.register === 'both';
}
function filterPhrases(sceneKey){
  return PHRASES.filter(p =>
    p.scene === sceneKey &&
    matchAudience(p, state.filters.audience) &&
    matchRegister(p, state.filters.register)
  );
}

/* ============================================================
   3. 渲染
   ============================================================ */
function render(){
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('active',
      b.dataset.nav === state.view ||
      (state.view === 'scene' && b.dataset.nav === 'home')
    );
  });
  if(state.view === 'home') return renderHome();
  if(state.view === 'scene') return renderScene();
  if(state.view === 'quiz') return renderQuiz();
  if(state.view === 'fav') return renderFav();
  if(state.view === 'about') return renderAbout();
}

function renderHome(){
  app.innerHTML = `
    <h1>阿拉伯語禮儀短句助手</h1>
    <p class="lead">選擇情境 → 選擇對象與正式度 → 看短句、聽發音、讀文化提示。共 ${SCENES.length} 個情境、${PHRASES.length} 句實用短句。</p>
    <div class="grid">
      ${SCENES.map(s => `
        <button class="scene-card" data-scene="${s.key}">
          <div class="scene-icon">${s.icon}</div>
          <div class="scene-name">${s.name}</div>
          <div class="scene-ar">${s.ar}</div>
        </button>
      `).join('')}
    </div>
  `;
}

function renderScene(){
  const scene = SCENES.find(s => s.key === state.scene);
  if(!scene) return renderHome();
  const list = filterPhrases(state.scene);
  const f = state.filters;

  app.innerHTML = `
    <button class="btn back" data-nav="home">← 返回情境</button>
    <h1>${scene.icon} ${scene.name}</h1>
    <p class="lead">調整下方條件，篩選適合的短句。</p>

    <div class="filters">
      <div class="fgroup">
        <label>對象</label>
        ${[['all','全部'],['elder','長輩'],['peer','同輩'],['younger','晚輩']].map(([v,t]) =>
          `<button class="chip ${f.audience===v?'on':''}" data-filter="audience" data-value="${v}">${t}</button>`
        ).join('')}
      </div>
      <div class="fgroup">
        <label>性別</label>
        ${[['male','對男性'],['female','對女性']].map(([v,t]) =>
          `<button class="chip ${f.gender===v?'on':''}" data-filter="gender" data-value="${v}">${t}</button>`
        ).join('')}
      </div>
      <div class="fgroup">
        <label>正式度</label>
        ${[['all','全部'],['formal','正式'],['casual','日常']].map(([v,t]) =>
          `<button class="chip ${f.register===v?'on':''}" data-filter="register" data-value="${v}">${t}</button>`
        ).join('')}
      </div>
    </div>

    <div class="count">目前符合 <b>${list.length}</b> 句</div>

    ${list.length === 0
      ? `<div class="empty">此組合尚無短句，試試切換其他條件。</div>`
      : list.map(p => phraseCard(p)).join('')}
  `;
}

function phraseCard(p){
  const form = displayForm(p);
  const regText = p.register === 'formal' ? '正式' : (p.register === 'casual' ? '日常' : '正式／日常');
  const audText = p.audience.includes('all') ? '通用對象' :
    p.audience.map(a => ({elder:'長輩',peer:'同輩',younger:'晚輩'}[a])).join('、');
  const fav = isFav(p.id);

  return `
    <div class="phrase">
      <div class="ar">${form.ar}</div>
      <div class="tr">${esc(form.tr)}</div>
      ${form.note ? `<div class="gender-note">（${form.note}）</div>` : ''}
      <div class="zh">${esc(p.zh)}</div>
      <div class="tags">
        <span class="tag">${regText}</span>
        <span class="tag gray">${audText}</span>
        ${p.gender === 'variable' ? '<span class="tag">有性別變體</span>' : ''}
      </div>
      <div class="actions">
        <button class="btn" data-speak="${p.id}">🔊 播放</button>
        <button class="btn ${fav?'saved':''}" data-fav="${p.id}">${fav?'★ 已收藏':'☆ 收藏'}</button>
      </div>
      <details>
        <summary>使用時機與文化提示</summary>
        <div class="detail-body">
          <div><b>使用時機：</b>${esc(p.usage)}</div>
          ${p.example ? `<div><b>例句：</b>
            <div class="example-ar">${esc(p.example.ar)}</div>
            <div class="example-zh">${esc(p.example.zh)}</div>
          </div>` : ''}
          ${p.tip ? `<div><b>文化提示：</b>${esc(p.tip)}</div>` : ''}
          ${p.taboo ? `<div><b>注意：</b>${esc(p.taboo)}</div>` : ''}
        </div>
      </details>
    </div>
  `;
}

/* ---------- 測驗 ---------- */
function startQuiz(){
  const pool = shuffle(PHRASES).slice(0, 5);
  const questions = pool.map((p, i) => {
    const type = i % 2 === 0 ? 'zh2ar' : 'ar2zh';
    const correct = type === 'zh2ar' ? p.ar : p.zh;
    const others = shuffle(PHRASES.filter(x => x.id !== p.id)).slice(0, 3)
      .map(x => type === 'zh2ar' ? x.ar : x.zh);
    return {
      type,
      prompt: type === 'zh2ar' ? p.zh : p.ar,
      options: shuffle([correct, ...others]),
      answer: correct
    };
  });
  state.quiz = {questions, idx:0, score:0, picked:null};
  render();
}

function renderQuiz(){
  if(!state.quiz){
    app.innerHTML = `
      <h1>小測驗</h1>
      <p class="lead">5 題隨機出題，測試你對禮儀短句的記憶。</p>
      <button class="btn" data-quiz-start>開始測驗</button>
    `;
    return;
  }
  const q = state.quiz;
  if(q.idx >= q.questions.length){
    app.innerHTML = `
      <h1>測驗結果</h1>
      <div class="quiz-box quiz-result">
        <div class="score">${q.score} / ${q.questions.length}</div>
        <p class="lead">${q.score === q.questions.length ? '全對，太厲害了！' : '再接再厲，多複習幾次就會記住。'}</p>
        <button class="btn" data-quiz-start>再來一次</button>
      </div>
    `;
    return;
  }
  const cur = q.questions[q.idx];
  const answered = q.picked !== null;
  app.innerHTML = `
    <h1>小測驗</h1>
    <div class="quiz-box">
      <div class="quiz-progress">第 ${q.idx + 1} / ${q.questions.length} 題</div>
      <div class="quiz-q">${cur.type === 'zh2ar' ? '下列哪一句阿拉伯語的意思是：' : '這句阿拉伯語是什麼意思？'}
        <div class="${cur.type === 'zh2ar' ? '' : 'ar'}">${esc(cur.prompt)}</div>
      </div>
      ${cur.options.map(o => {
        let cls = 'opt';
        if(answered){
          if(o === cur.answer) cls += ' correct';
          else if(o === q.picked) cls += ' wrong';
        }
        return `<button class="${cls}" data-opt="${esc(o)}" ${answered?'disabled':''}>
          <span class="${cur.type === 'zh2ar' ? 'ar' : ''}">${esc(o)}</span>
        </button>`;
      }).join('')}
      ${answered ? `<button class="btn" data-quiz-next>下一題 →</button>` : ''}
    </div>
  `;
}

/* ============================================================
   4. 事件處理
   ============================================================ */
document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){
    state.view = navBtn.dataset.nav;
    state.scene = null;
    if(state.view === 'quiz') state.quiz = null;
    render();
    window.scrollTo(0,0);
    return;
  }

  const sceneBtn = e.target.closest('[data-scene]');
  if(sceneBtn){
    state.view = 'scene';
    state.scene = sceneBtn.dataset.scene;
    render();
    window.scrollTo(0,0);
    return;
  }

  const filterBtn = e.target.closest('[data-filter]');
  if(filterBtn){
    state.filters[filterBtn.dataset.filter] = filterBtn.dataset.value;
    render();
    return;
  }

  const speakBtn = e.target.closest('[data-speak]');
  if(speakBtn){
    const p = byId(speakBtn.dataset.speak);
    if(p){
      const form = displayForm(p);
      speak(form.ar);
    }
    return;
  }

  const favBtn = e.target.closest('[data-fav]');
  if(favBtn){
    toggleFav(favBtn.dataset.fav);
    return;
  }

  if(e.target.closest('[data-quiz-start]')){
    startQuiz();
    window.scrollTo(0,0);
    return;
  }

  const optBtn = e.target.closest('[data-opt]');
  if(optBtn && state.quiz && state.quiz.picked === null){
    const q = state.quiz;
    const cur = q.questions[q.idx];
    q.picked = optBtn.dataset.opt;
    if(q.picked === cur.answer) q.score++;
    render();
    return;
  }

  if(e.target.closest('[data-quiz-next]')){
    const q = state.quiz;
    q.idx++;
    q.picked = null;
    render();
    window.scrollTo(0,0);
    return;
  }
});

render();
</script>
